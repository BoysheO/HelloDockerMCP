services:
  docker-dind:
    image: docker:27-dind
    container_name: hello-docker-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - docker-dind-data:/var/lib/docker
      - ./storage:/storage
    expose:
      - "2375"
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  hello-docker-mcp:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: hello-docker-mcp
    working_dir: /src
    environment:
      DOCKER_HOST: http://docker-dind:2375
      OAuth__Enabled: ${HELLO_DOCKER_OAUTH_ENABLED:-true}
      OAuth__Issuer: ${HELLO_DOCKER_OAUTH_ISSUER:-http://localhost:5001}
      OAuth__SigningKey: ${HELLO_DOCKER_OAUTH_SIGNING_KEY:-dev-only-change-me-at-least-32-bytes}
      OAuth__Scope: ${HELLO_DOCKER_OAUTH_SCOPE:-mcp}
      OAuth__ResourceName: ${HELLO_DOCKER_OAUTH_RESOURCE_NAME:-Hello Docker MCP}
      Skill__Path: /skill/Skill.md
      # Storage__RootPath: /storage
    volumes:
      - ./HelloDockerMcp:/src
      - ./storage:/storage
      - ./HelloDockerMcp/Skill.md:/skill/Skill.md
      - ./logs:/src/logs
    command: sh -c "dotnet restore && dotnet run --no-restore --urls http://*:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      docker-dind:
        condition: service_healthy
      hello-docker-auth:
        condition: service_started
    restart: always

  hello-docker-auth:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: hello-docker-auth
    working_dir: /src
    environment:
      OAuth__Issuer: ${HELLO_DOCKER_OAUTH_ISSUER:-http://localhost:5001}
      OAuth__SigningKey: ${HELLO_DOCKER_OAUTH_SIGNING_KEY:-dev-only-change-me-at-least-32-bytes}
      OAuth__AccessTokenLifetimeSeconds: ${HELLO_DOCKER_OAUTH_ACCESS_TOKEN_LIFETIME_SECONDS:-3600}
      OAuth__AuthorizationCodeLifetimeSeconds: ${HELLO_DOCKER_OAUTH_AUTHORIZATION_CODE_LIFETIME_SECONDS:-300}
      OAuth__Accounts__0__Username: ${HELLO_DOCKER_OAUTH_USERNAME:-admin}
      OAuth__Accounts__0__Password: ${HELLO_DOCKER_OAUTH_PASSWORD:-password}
    volumes:
      - ./HelloDockerAuth:/src
    command: sh -c "dotnet restore && dotnet run --no-restore --urls http://*:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: always

  frpc:
    image: ghcr.io/snowdreamtech/frpc:0.63.0
    container_name: frpc4hello-docker-mcp
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    depends_on:
      hello-docker-mcp:
        condition: service_healthy
      hello-docker-auth:
        condition: service_healthy
    restart: always

volumes:
  docker-dind-data:
